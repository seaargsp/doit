# Global Gradle configuration for DoIt project

# Enable Gradle build cache globally
org.gradle.caching=true

# Enable parallel execution
org.gradle.parallel=true

# Enable daemon for faster builds
org.gradle.daemon=true

# Increase memory allocation for Gradle daemon
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Enable configuration cache (disabled for Expo compatibility)
# org.gradle.configuration-cache=true

# Enable file system watching for faster incremental builds
org.gradle.vfs.watch=true

# Reduce startup time
org.gradle.configureondemand=true

# Enable build scan for performance analysis (uncomment if needed)
# org.gradle.scan=true